[lab_host_from_syslog]
REGEX = ^\S+\s+(\S+)\s
FORMAT = host::$1
DEST_KEY = MetaData:Host

[lab_host_from_computername]
REGEX = ComputerName=(\S+)
FORMAT = host::$1
DEST_KEY = MetaData:Host

[lab_host_from_sysmon]
REGEX = "Computer":\s*"([^"]+)"
FORMAT = host::$1
DEST_KEY = MetaData:Host

[lab_host_from_loki]
REGEX = ^\S+\s+(\S+)\s+LOKI:
FORMAT = host::$1
DEST_KEY = MetaData:Host

[sha1_lookup]
filename = sha1_whitelist.csv
min_matches = 1
default_match = INTROUVABLE

[malicious]
filename = malicious_ips.csv
min_matches = 1
default_match = clean

[ioc_domains]
filename = ioc_domains.csv
match_type = WILDCARD(domain)
min_matches = 1
default_match = clean

# Pays d'où les connexions VPN sont attendues
[vpn_allowed_countries]
filename = vpn_allowed_countries.csv
