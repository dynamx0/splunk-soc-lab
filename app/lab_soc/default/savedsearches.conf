# Alertes du lab (planifiées toutes les 5 minutes)

[SOC - Brute Force OpenVPN]
description = Plus de 5 échecs d'authentification VPN depuis une même IP en 5 minutes
alert.severity = 4
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = lab_soc
request.ui_dispatch_view = search
dispatchAs = owner
search = index=fw_athena process=openvpn action=failure \
| stats count AS echecs dc(user) AS nb_comptes values(user) AS comptes_testes by src_ip \
| where echecs>5 \
| iplocation src_ip \
| table src_ip Country City echecs nb_comptes comptes_testes


[SOC - Connexion VPN depuis un pays inhabituel]
description = Connexion VPN réussie depuis un pays absent de la liste vpn_allowed_countries
alert.severity = 3
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = lab_soc
request.ui_dispatch_view = search
dispatchAs = owner
search = index=fw_athena process=openvpn action=success \
| iplocation src_ip \
| lookup vpn_allowed_countries Country OUTPUT allowed \
| where isnull(allowed) \
| table _time user src_ip Country City

[SOC - Utilisateur VPN avec 3 IP ou plus en 1h]
description = Un même compte se connecte depuis au moins 3 adresses IP différentes en une heure
alert.severity = 4
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
action.email = 0
request.ui_dispatch_app = lab_soc
request.ui_dispatch_view = search
dispatchAs = owner
search = index=fw_athena process=openvpn action=success user=* \
| stats dc(src_ip) AS nb_ips values(src_ip) AS ips count by user \
| where nb_ips>=3 \
| table user nb_ips ips count


[SOC - Brute Force Windows]
description = Plus de 3 échecs Kerberos (4771) pour un même compte et une même IP en 5 minutes
alert.severity = 5
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=wineventlog EventCode=4771 \
| stats count AS Tentatives values(ComputerName) AS DC by Account_Name src_ip \
| where Tentatives>3

[SOC - Suppression des logs]
description = Effacement du journal de sécurité Windows (1102 ou 517)
alert.severity = 5
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=wineventlog (EventCode=1102 OR EventCode=517) \
| table _time ComputerName Account_Name src_ip Message

[SOC - Service suspect installé]
description = Installation d'un service Windows (7045)
alert.severity = 4
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=wineventlog EventCode=7045 \
| table _time ComputerName Account_Name Service_Name Service_File_Name Service_Start_Type

[SOC - Persistance via clé Run]
description = Programme inscrit dans la clé de registre Run (Sysmon 13)
alert.severity = 4
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=sysmon EventCode=13 TargetObject="*CurrentVersion*Run*" \
| table _time host Image TargetObject Details


[SOC - Ransomware création massive de fichiers]
description = Plus de 10 fichiers créés en une minute par un programme absent de la liste blanche
alert.severity = 5
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=sysmon EventCode=11 \
| bin _time span=1m \
| stats count AS nouveaux_fichiers by _time host Image sha1 \
| where nouveaux_fichiers>10 \
| lookup sha1_lookup sha1 OUTPUT whitelisted_file \
| where whitelisted_file="INTROUVABLE"

[SOC - Communication avec un serveur C&C]
description = Trafic autorisé par le pare-feu vers une adresse de la liste noire
alert.severity = 5
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=firewall action=pass \
| lookup malicious clientip AS dst_ip OUTPUT threat ti_source \
| where threat!="clean" \
| stats count AS connexions sum(bytes) AS octets by src_ip dst_ip threat ti_source

[SOC - Activité DNS inhabituelle]
description = Plus de 100 requêtes DNS uniques de même longueur depuis un même poste en une heure
alert.severity = 4
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=dns \
| eval Length=len(query) \
| stats count AS requetes dc(query) AS uniques by client_ip Length \
| where uniques>100

[SOC - Loki IOC détecté]
description = Le scanner Loki a levé une alerte
alert.severity = 5
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -6m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
search = index=loki level=ALERT \
| table _time host score message file sha1 remote_ip reason
