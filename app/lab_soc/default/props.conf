[lab:vpn]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
EXTRACT-process = ^\S+\s+\S+\s+(?<process>[\w-]+)\[(?<pid>\d+)\]
TRANSFORMS-host = lab_host_from_syslog

[lab:firewall]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
EXTRACT-fw = ^\S+\s+(?<fw_name>\S+)\s+filterlog
TRANSFORMS-host = lab_host_from_syslog

[lab:wineventlog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
TRANSFORMS-host = lab_host_from_computername
FIELDALIAS-cim = Account_Name AS user src_ip AS src

[lab:sysmon]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "time":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = json
TRANSFORMS-host = lab_host_from_sysmon

[lab:dns]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
FIELDALIAS-clientip = client_ip AS clientip
TRANSFORMS-host = lab_host_from_syslog

[lab:proxy]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
EVAL-domain = replace(url, "^\w+://([^/:]+).*$", "\1")
TRANSFORMS-host = lab_host_from_syslog

[lab:loki]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
TRANSFORMS-host = lab_host_from_loki
