[ALERT - VPN Impossible Travel]
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = 0 * * * *
description = Connexion VPN depuis deux lieux distants de plus de 500 km en moins de 60 min
dispatch.earliest_time = -1h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.mapHeight = 283
display.visualizations.type = mapping
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = lab_soc
request.ui_dispatch_view = search
search = index=fw_athena process=openvpn action=success user=*\
| iplocation src_ip\
| where isnotnull(lat)\
| sort 0 user _time\
| streamstats current=f window=1 last(src_ip) AS p_ip last(City) AS p_ville last(Country) AS p_pays last(lat) AS p_lat last(lon) AS p_lon last(_time) AS p_time by user\
| where isnotnull(p_ip)\
| eval delta_min=round((_time-p_time)/60,0)\
| eval dlat=(lat-p_lat)*pi()/180, dlon=(lon-p_lon)*pi()/180\
| eval a=pow(sin(dlat/2),2)+cos(p_lat*pi()/180)*cos(lat*pi()/180)*pow(sin(dlon/2),2)\
| eval distance_km=round(2*6371*atan2(sqrt(a),sqrt(1-a)),0)\
| where distance_km>500 AND delta_min<60\
| table _time user p_ville p_pays City Country distance_km delta_min
